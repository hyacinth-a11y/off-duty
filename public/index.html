<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Off Duty — team time-off & Slack notices</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="apple-touch-icon" href="favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=40">
</head>
<body>
<header class="topbar">
  <button id="navToggle" class="nav-toggle" title="Show/hide menu">☰</button>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 30" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="5" width="28" height="24" rx="5.5" stroke="currentColor" stroke-width="2.6"/>
      <path d="M2 12h28" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
      <rect x="8" y="1" width="2.8" height="7" rx="1.4" fill="currentColor"/>
      <rect x="21.2" y="1" width="2.8" height="7" rx="1.4" fill="currentColor"/>
      <circle cx="9" cy="18" r="1.7" fill="currentColor" opacity="0.4"/>
      <circle cx="15" cy="18" r="1.7" fill="currentColor" opacity="0.4"/>
      <circle cx="22.5" cy="18.5" r="3.6" fill="#ffb454"/>
      <circle cx="9" cy="24" r="1.7" fill="currentColor" opacity="0.4"/>
      <circle cx="15" cy="24" r="1.7" fill="currentColor" opacity="0.4"/>
    </svg></span>
    <span class="brand-name">Off Duty</span>
  </div>
  <input type="search" id="globalSearch" class="global-search" placeholder="Search projects or members…">
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <nav>
      <button class="nav-item" data-sec="projectview">📣 <span>Send Notif</span></button>
      <button class="nav-item" data-sec="timeoff">🗓️ <span>Time-Off Entries</span></button>
      <button class="nav-item" data-sec="projects">📁 <span>Projects</span></button>
      <button class="nav-item" data-sec="members">👥 <span>Team Members</span></button>
      <button class="nav-item" data-sec="holidays">🎉 <span>Holidays</span></button>
      <button class="nav-item" data-sec="settings">⚙️ <span>Settings</span></button>
    </nav>
    <div class="sidebar-footer">
      <div id="windowChip" class="window-chip" title="Time-off shown in notifications falls inside this window"></div>
      <button id="themeToggle" class="theme-toggle" title="Toggle light/dark mode">🌙 <span>Night mode</span></button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast" class="toast" hidden></div>

<script src="app.js?v=40"></script>
</body>
</html>
